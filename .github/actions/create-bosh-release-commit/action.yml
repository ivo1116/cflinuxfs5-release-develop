name: 'Commit BOSH Release Repo'
description: 'Commit and push changes after creating a final BOSH release'

inputs:
  release_dir:
    description: 'Path to the BOSH release repository'
    required: true
  git_user_name:
    description: 'Git user.name for commit'
    required: true
  git_user_email:
    description: 'Git user.email for commit'
    required: true
  target_branch:
    description: 'Branch to push to (defaults to current branch)'
    required: false
    default: ''

outputs:
  commit_sha:
    description: 'Commit SHA of the pushed release commit'
    value: ${{ steps.commit.outputs.commit_sha }}

runs:
  using: 'composite'
  steps:
  - name: Commit and push changes
    id: commit
    shell: bash
    run: |
      set -euo pipefail
      
      pushd "${{ inputs.release_dir }}"

        git config user.name "${{ inputs.git_user_name }}"
        git config user.email "${{ inputs.git_user_email }}"

        git add config/blobs.yml
        git add .final_builds/
        git add releases/

        if git diff --staged --quiet; then
          echo "No changes to commit"
          sha=$(git rev-parse HEAD)
        else
          git commit -m "Finalize BOSH release"
        fi

        git fetch origin
        
        # Determine target branch - use input if provided, otherwise use GITHUB_REF_NAME
        TARGET_BRANCH="${{ inputs.target_branch }}"
        if [[ -z "$TARGET_BRANCH" ]]; then
          TARGET_BRANCH="${GITHUB_REF_NAME}"
        fi
        
        echo "Pushing to branch: $TARGET_BRANCH"
        git push origin HEAD:${TARGET_BRANCH}

        sha=$(git rev-parse HEAD)

        echo "commit_sha=$sha" >> "$GITHUB_OUTPUT"

      popd
